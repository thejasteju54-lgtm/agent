version: "3.8"

services:
  marketpulse-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: marketpulse-ai:latest
    container_name: marketpulse-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - ENVIRONMENT=production
      - OPERATING_MODE=cloud
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - API_SECRET_KEY=${MARKETPULSE_API_SECRET:-mp-cloud-secret-token-change-in-prod}
      - DATABASE_URL=postgresql://marketpulse:${POSTGRES_PASSWORD:-marketpulse_secret}@postgres:5432/marketpulse
      - DEFAULT_MODEL_PROVIDER=${DEFAULT_MODEL_PROVIDER:-cloud}
      - CLOUD_API_KEY=${CLOUD_API_KEY:-}
      - CLOUD_API_BASE=${CLOUD_API_BASE:-https://api.openai.com/v1}
      - CLOUD_MODEL=${CLOUD_MODEL:-gpt-4o-mini}
      - N8N_ENABLED=true
      - N8N_BASE_URL=http://n8n:5678
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      - LOG_LEVEL=INFO
    volumes:
      - marketpulse_artifacts:/app/artifacts
      - marketpulse_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - marketpulse-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: marketpulse-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=marketpulse
      - POSTGRES_USER=marketpulse
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-marketpulse_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - marketpulse-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  n8n:
    image: n8nio/n8n:latest
    container_name: marketpulse-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_PUBLIC_WEBHOOK_URL:-http://localhost:5678/}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - marketpulse-net

volumes:
  postgres_data:
    name: marketpulse_postgres_data
  marketpulse_artifacts:
    name: marketpulse_artifacts_data
  marketpulse_logs:
    name: marketpulse_logs_data
  n8n_data:
    name: marketpulse_n8n_data

networks:
  marketpulse-net:
    name: marketpulse-net
    driver: bridge
